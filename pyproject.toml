[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "career-loop"
version = "0.1.0"
description = "AI 求职漏斗 Agent：预测匹配 -> 记录投递 -> 回流结果 -> 校准模型。带标注评测集，规则基线 + LLM 模式。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "your-name" }]
keywords = ["job", "career", "agent", "llm", "resume", "eval", "calibration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
ui = ["streamlit>=1.30"]
dev = ["pytest>=8"]

[project.scripts]
career-loop = "career_loop.cli:main"

[project.urls]
Homepage = "https://github.com/your-name/career-loop"

[tool.setuptools]
packages = ["career_loop"]
