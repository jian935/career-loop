  },
  education:{
    edu_teach:{label:"教学/授课", kw:["教学","授课","备课","课堂","学员"]},
    edu_curriculum:{label:"课程/教研", kw:["课程","教研","教案","课纲"]}
  },
  healthcare:{
    med_clinical:{label:"临床/护理", kw:["临床","护理","诊断","病历","医嘱"]},
    med_pharma:{label:"药学/医学", kw:["药学","药理","医学","gmp"]}
  },
  legal:{ legal_contract:{label:"合同/法务", kw:["合同","法务","诉讼","仲裁","合规审查"]} },
  supply:{ scm_supply:{label:"供应链/采购", kw:["供应链","采购","仓储","物流","库存"]} },
  manufacturing:{ mfg_process:{label:"工艺/生产", kw:["工艺","生产","设备","质量","cad","solidworks"]} }
};
const ALL_DIMS = Object.assign({}, TAXONOMY, GENERAL_DIMS);
for(const pk in DOMAIN_PACKS){
  for(const k in DOMAIN_PACKS[pk]){ if(!ALL_DIMS[k]) ALL_DIMS[k]=DOMAIN_PACKS[pk][k]; }
}
const DOMAIN_CN={ai:"AI/技术",product:"产品",marketing:"市场",sales:"销售",finance:"财务",design:"设计",operations:"运营",hr:"人力",education:"教育",healthcare:"医疗",legal:"法务",supply:"供应链",manufacturing:"制造"};
const CUSTOM_STOP=new Set(["负责","经验","相关","工作","能力","要求","熟悉","了解","具备","完成","以及","进行","能够","优先","以上","学历","本科","专业","岗位","职责","任职","参与","独立","熟练","掌握","良好","一定","具有","使用"]);
const REQ_SIGNALS=["熟悉","掌握","具备","能够","会","负责","了解","精通","熟练","经验","优先","要求","独立","完成","参与","维护","开发","设计","管理","推进","分析","制定","执行","对接","沟通","处理","操作","使用"];
const NOISE_MARKERS=["薪资","福利","五险","双休","地点","地址","公司简介","融资","规模","简历投递","邮箱","微信","电话","官网","包吃","补贴","年终奖","团建","上班时间"];
const ACTION=["做","实现","搭建","开发","写","上线","设计","优化","负责","跑通","落地","迭代","维护","主导","参与","评测","标注","梳理","标出","定","记录","画","配置","封装","搭","报","跑","输出","录","整理","建","分析","对比","统计","定位"];
const NEG=["没有","未","尚未","只做过","只在自己","仅","缺少","谈不上","没做","没统计","感觉还行","demo","玩具","简单","粗略","没实际"];
const STRONG_NEG=["没用过","没做过","从没","完全没有","毫无","从不","没碰过","没接触","不了解"];
const STRONG=["精通","深入","独立","主导","熟练掌握","扎实","闭环","从0到1","从 0 到 1"];
const SECTIONS=[
  {name:"job", markers:["岗位职责","工作职责","工作内容","职位描述","你将","职责"]},
  {name:"must", markers:["任职要求","岗位要求","任职资格","基础要求","要求"]},
  {name:"nice", markers:["优先条件","加分项","优先","bonus"]}
];
const BULLET=/^\s*(?:[-*+•]|\d+[.、)]|[（(]\d+[)）])\s*/;
const ST_LABEL={full:"已具备", partial:"部分", missing:"缺失"};

function stripLine(s){
  return s.replace(BULLET,"").replace(/\s+/g," ").trim();
}
function detectSection(line){
  const s=line.replace(/[#*【】\[\]：:\s]/g,"");
  if(s.length>30) return null;
  for(const sec of SECTIONS){
    for(const m of sec.markers){
      if(s.includes(m)){
        const left=s.split(m).join("").trim();
        if(left.length<=4) return sec.name;
      }
    }
  }
  return null;
}
function hitsOf(line){
  const low=line.toLowerCase(), out=[];
  for(const k in ALL_DIMS){
    let mx=0;
    for(const kw of ALL_DIMS[k].kw){ if(low.includes(kw.toLowerCase())) mx=Math.max(mx,kw.length); }
    if(mx>0) out.push({key:k,maxLen:mx});
  }
  return out;
}
function looksLikeReq(line){
  if(line.length<6 || line.length>120) return false;
  if(NOISE_MARKERS.some(n=>line.includes(n))) return false;
  return REQ_SIGNALS.some(s=>line.includes(s));
}
function customLabel(line){
  let s=stripLine(line).replace(/^(负责|熟悉|掌握|具备|能够|要求|参与|独立|完成|了解|精通|熟练)/,"");
  return (s.slice(0,16) || line.slice(0,16)).trim();
}
function hashKey(s){
  let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))>>>0; }
  return "custom:"+h.toString(16);
}
function weightOf(section,line){
  if(section==="nice") return 1;
  if(section==="job") return 2;
  return STRONG.some(w=>line.includes(w)) ? 3 : 2;
}
function parseJD(text){
  const lines=text.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const req={}; let section="must";
  for(const raw of lines){
    if(raw.startsWith("#")) continue;
    if(raw.startsWith("【") && raw.length<24) continue;
    const sec=detectSection(raw);
    if(sec){ section=sec; continue; }
    if(raw.length<6) continue;
    const hits=hitsOf(raw);
    const w=weightOf(section,raw);
    if(hits.length){
      for(const h of hits){
        const prev=req[h.key];
        if(!prev || w>prev.weight) req[h.key]={key:h.key,label:ALL_DIMS[h.key].label,weight:w,quote:raw.slice(0,90)};
      }
    }else if(looksLikeReq(raw)){
      const ck=hashKey(raw);
      const prev=req[ck];
      if(!prev || w>prev.weight) req[ck]={key:ck,label:customLabel(raw),weight:w,quote:raw.slice(0,90),custom:true};
    }
  }
  return Object.keys(req).map(k=>req[k]);
}
function parseProfile(text){
  const lines=text.split(/\n+/).map(s=>s.trim()).filter(Boolean)
    .filter(l=>!l.startsWith("#"))
    .map(stripLine).filter(l=>l.length>=6);
  const owned={};
  for(const line of lines){
    const hits=hitsOf(line).sort((a,b)=>b.maxLen-a.maxLen).slice(0,4);
    for(const h of hits){
      if(h.maxLen<2) continue;
      (owned[h.key]=owned[h.key]||[]).push(line);
    }
  }
  return {owned, lines};
}
function bigrams(s){
  s=s.toLowerCase().replace(/[^\u4e00-\u9fa5a-z0-9]/g,"");
  const out=new Set();
  for(let i=0;i<s.length-1;i++) out.add(s.slice(i,i+2));
  return out;
}
function matchCustom(req, lines){
  const target=bigrams(req.quote);
  CUSTOM_STOP.forEach(b=>target.delete(b));
  if(!target.size) return {status:"missing",evidence:""};
  let best=0,bestLine="",bestShared=0;
  for(const line of lines){
    const pb=bigrams(line); let sh=0;
    target.forEach(b=>{ if(pb.has(b)) sh++; });
    const c=sh/target.size;
    if(c>best){ best=c; bestLine=line; bestShared=sh; }
  }
  if(best>=0.5) return {status:ACTION.some(a=>bestLine.includes(a))?"full":"partial", evidence:bestLine};
  if(bestShared>=2 || (bestShared>=1 && best>=0.1)) return {status:"partial", evidence:bestLine};
  return {status:"missing", evidence:""};
}
function statusOf(key,owned){
  const cs=owned[key]||[];
  if(!cs.length) return {status:"missing",evidence:""};
  if(cs.some(l=>STRONG_NEG.some(s=>l.includes(s)))) return {status:"missing",evidence:cs[0]};
  for(const l of cs){
    if(ACTION.some(a=>l.includes(a))) return {status: NEG.some(n=>l.includes(n))?"partial":"full", evidence:l};
  }
  return {status:"partial", evidence:cs[0]};
}
function scoreOf(reqs,matches){
  let tot=0,got=0;
  for(const r of reqs){
    tot+=r.weight;
    const st=(matches[r.key]||{}).status||"missing";
    got += r.weight * (st==="full"?1:(st==="partial"?0.5:0));
  }
  return tot ? Math.round(got/tot*1000)/10 : 0;
}
function detectDomains(text){
  const low=text.toLowerCase(), scores={};
  for(const name in DOMAIN_PACKS){
    let c=0;
    for(const k in DOMAIN_PACKS[name]){ for(const kw of DOMAIN_PACKS[name][k].kw){ if(low.includes(kw.toLowerCase())) c++; } }
    if(c) scores[name]=c;
  }
  let ai=0;
  for(const k in TAXONOMY){ for(const kw of TAXONOMY[k].kw){ if(low.includes(kw.toLowerCase())) ai++; } }
  if(ai>=2) scores.ai=ai;
  return Object.keys(scores).sort((a,b)=>scores[b]-scores[a]);
}
function compute(jdText, profileText){
  const reqs=parseJD(jdText), pp=parseProfile(profileText);
  const matches={};
  for(const r of reqs) matches[r.key]= r.custom ? matchCustom(r, pp.lines) : statusOf(r.key, pp.owned);
  const base=scoreOf(reqs,matches);
  const ups=[];
  for(const r of reqs){
    if(matches[r.key].status==="full") continue;
    const sim=Object.assign({},matches,{[r.key]:{status:"full"}});
    const ns=scoreOf(reqs,sim);
    if(ns>base) ups.push({req:r,status:matches[r.key].status,delta:Math.round((ns-base)*10)/10,newScore:ns});
  }
  ups.sort((a,b)=>b.delta-a.delta);
  return {reqs,matches,base,ups,domains:detectDomains(jdText)};
}
function el(id){return document.getElementById(id);}
function render(res){
  const s=el("score");
  s.textContent=res.base.toFixed(1)+"%";
  s.className="score "+(res.base>=70?"ok":res.base>=50?"warn":"bad");
  const doms=(res.domains||[]).slice(0,3).map(d=>DOMAIN_CN[d]||d);
  el("mode").textContent="规则基线"+(doms.length?" · "+doms.join(" / "):" · 通用");

  const m=el("matrix"); m.innerHTML="";
  if(!res.reqs.length){ m.innerHTML='<div class="empty">JD 里没有识别到能力要求，试试更具体的岗位描述。</div>'; }
  const sorted=res.reqs.slice().sort((a,b)=>b.weight-a.weight);
  for(const r of sorted){
    const st=res.matches[r.key].status;
    const d=document.createElement("div");
    d.className="chip "+st;
    d.title=(res.matches[r.key].evidence||r.quote||"").trim();
    d.innerHTML='<span class="name">'+r.label+'</span><span class="st">'+ST_LABEL[st]+'</span>';
    m.appendChild(d);
  }

  const u=el("uplift"); u.innerHTML="";
  if(!res.ups.length){
    u.innerHTML='<li class="empty">已全部覆盖，没有可提升的项。换个更难的岗位试试？</li>';
    return;
  }
  const max=res.ups[0].delta||1;
  for(const it of res.ups.slice(0,5)){
    const li=document.createElement("li");
    li.innerHTML=
      '<div class="u-head"><span class="u-name">'+it.req.label+'</span>'+
      '<span class="u-delta">+'+it.delta.toFixed(1)+'</span></div>'+
      '<div class="u-sub">当前 '+res.base.toFixed(1)+'% → 补到「已具备」后 '+it.newScore.toFixed(1)+'%（原状态：'+ST_LABEL[it.status]+'）</div>'+
      '<div class="bar"><i style="width:'+Math.max(6,it.delta/max*100)+'%"></i></div>';
    u.appendChild(li);
  }
}

const SAMPLES=[
  {jd:SAMPLE_A_JD, profile:SAMPLE_PROFILE},
  {jd:SAMPLE_B_JD, profile:SAMPLE_PROFILE},
  {jd:SAMPLE_FIN_JD, profile:SAMPLE_FIN_PROFILE}

let sampleIdx=0;
function loadSample(i){
  el("jd").value=SAMPLES[i].jd;
  el("profile").value=SAMPLES[i].profile;
  run();
}
function run(){
  const jd=el("jd").value.trim(), p=el("profile").value.trim();
  if(!jd){ el("score").textContent="--"; el("matrix").innerHTML=""; el("uplift").innerHTML=""; return; }
  render(compute(jd,p));
}
let timer=null;
function debounceRun(){
  clearTimeout(timer);
  timer=setTimeout(run,260);
}

el("run").addEventListener("click",run);
el("sample").addEventListener("click",()=>{ sampleIdx=(sampleIdx+1)%SAMPLES.length; loadSample(sampleIdx); });
el("jd").addEventListener("input",debounceRun);
el("profile").addEventListener("input",debounceRun);
const qs=new URLSearchParams(location.search).get("s");
sampleIdx = qs===null ? 0 : Math.max(0, Math.min(SAMPLES.length-1, parseInt(qs,10)||0));
