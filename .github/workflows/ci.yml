name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Windows runner 是英文系统（控制台代码页 cp1252）。`career-loop --help` 打印中文时
  # argparse 抛 UnicodeEncodeError（实测 position 276-284）并以 exit 1 结束——
  # 代码本身没问题，是环境编码，所以全局强制子进程用 UTF-8 输出。
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      # CI 一直只跑 `python -m career_loop`，等于从没验过 pyproject 里那个
      # console script 真的能用（README 让用户直接输 `career-loop`）。
      # 装完必须按用户的方式敲一遍。
      - name: Console script works (as users invoke it)
        run: career-loop --help
      # 再验一个**会读文件**的子命令，确认入口不是只解析了 --help 的参数表
      - name: Console script reads its own data
        run: career-loop occupations | grep -q "词表覆盖"
      - name: Syntax check
        run: python -m compileall -q career_loop
      - name: Unit tests
        run: python -m unittest discover -s career_loop/tests -p "test_*.py" -v
      - name: Eval baseline
        run: python -m career_loop eval --data data/eval_sample.jsonl --badcases badcases.jsonl
      - name: CLI audit
        run: python scripts/audit.py
      - name: Web vocabulary parity
        run: python scripts/sync_web_vocab.py --check
      # 资料库发布用的单文件页（docs/standalone.html）由 index.html 生成。
      # 改了 index.html 却忘记重跑构建，线上体验版就会是旧内容——用 --check 锁住。
      - name: Standalone page in sync
        run: python scripts/build_standalone.py --check
      # 这两项不需要任何私有数据（不像 cross_engine_check 依赖 gitignore 的校准 CSV），
      # 所以能进 CI：网页与 CLI 判的族必须是同一件事。
      - name: Cross-engine check (LLM family)
        run: python scripts/cross_engine_llm_check.py
      # 网页的「今日清单」与 `career-loop daily` 必须抽到同一个截止日：
      # 启发式解析最容易两边各写一遍然后悄悄漂移，差一天用户就不知道该信哪个。
      # --self-test 单独跑，确保这个比对本身有牙齿（注入的偏差必须被抓出来）。
      - name: Cross-engine check (daily deadline + occupation summary)
        run: python scripts/cross_engine_daily_check.py
      - name: Cross-engine daily check self-test
        run: python scripts/cross_engine_daily_check.py --self-test
      # 整段网页 JS 端到端冒烟：把 docs/index.html 的 <script> 在 Node 里跑起来，
      # 挨个点每个入口（含三种导出）。纯函数级的比对看不到 "页面上印 undefined"
      # 和 "导出按钮抛异常" 这类问题，这两类都在本机真的发生过。
      - name: Web demo end-to-end smoke
        run: python scripts/smoke_web.py
      - name: Web smoke self-test
        run: python scripts/smoke_web.py --self-test
      # 离线静态校验：本机通常没有 docker，靠这一步挡住最常见的腐坏
      # （COPY 源改名、运行时资产目录漏 COPY、ENTRYPOINT 与 pyproject 不一致）。
      - name: Dockerfile static check
        run: python scripts/check_dockerfile.py

  # 静态检查只能证明"路径和入口没写错"，容器真能起来只有 build 一次才知道。
  # 这个 Dockerfile 曾经从未被任何自动化跑过，任何一处基础镜像/权限改动都不会被发现。
  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t career-loop:ci .
      - name: Entry point works
        run: docker run --rm career-loop:ci --help
      # 断言用**文字标签**而不是具体百分比：数字口径一改（v0.8.26 就改过一次，
      # 49% → 78%），写死数字会让这条从"验证能读数据"变成"验证我没改数字"。
      - name: Reads its own data inside the image
        run: docker run --rm career-loop:ci occupations | grep -q "词表覆盖"
      - name: Full eval runs inside the image
        run: docker run --rm career-loop:ci eval --data data/eval_sample.jsonl

  # 看板是唯一依赖可选第三方包（streamlit）的部分，CI 不装它就永远不回归。
  # 单独一个 job：不塞进上面的 6 个矩阵 job 里，免得每个都多装一遍 streamlit。
  # smoke_dashboard.py 用 streamlit 自带的 AppTest 无头跑，不开浏览器，
  # --strict 表示没装 streamlit 就算失败（默认跳过是给本机留的方便）。
  ui:
    name: dashboard smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with UI extras
        run: python -m pip install -e ".[ui]"
      - name: Dashboard smoke (headless)
        run: python scripts/smoke_dashboard.py --strict
      - name: Dashboard smoke has teeth
        run: python scripts/smoke_dashboard.py --self-test
