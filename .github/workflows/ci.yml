name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Syntax check
        run: python -m compileall -q career_loop
      - name: Unit tests
        run: python -m unittest discover -s career_loop/tests -p "test_*.py" -v
      - name: Eval baseline
        run: python -m career_loop eval --data data/eval_sample.jsonl --badcases badcases.jsonl
      - name: CLI audit
        run: python scripts/audit.py
